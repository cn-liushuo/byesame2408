<button id="decrement">-</button>
<button id="count">0</button>
<button id="increment">+</button>

<!-- Redux 5 不再提供 dist/redux.js（UMD），该路径会 404；教学演示使用 4.x UMD 可得到全局 Redux -->
<script src="https://unpkg.com/redux@4.2.1/dist/redux.js"></script>

<script>
  // 1、定义 reducer 函数
  // 作用：根据不同的 action 对象，返回不同的新的 state
  // state: 管理的数据初始状态
  // action: 对象 type 标记当前想要做什么样的修改
  function reducer(state = { count: 0 }, action) {
    // 数据不可变：基于原始状态生成一个新的状态
    if (action.type === "INCREMENT") {
      return { count: state.count + 1 };
    }
    if (action.type === "DECREMENT") {
      return { count: state.count - 1 };
    }
    return state;
  }

  // 2、使用 reducer 函数生成 store 实例
  const store = Redux.createStore(reducer);

  // 3、通过 store 实例的 subscribe 订阅数据变化
  // 回调函数可以在每次 state 发生变化的时候自动执行
  store.subscribe(() => {
    console.log("state 变化了", store.getState());
    document.getElementById("count").innerText = store.getState().count;
  });

  // 4、通过 store 实例的 dispatch 函数提交 action 更改状态
  const inBtn = document.getElementById("increment");
  inBtn.addEventListener("click", () => {
    // 增
    store.dispatch({ type: "INCREMENT" });
  });

  const dBtn = document.getElementById("decrement");
  dBtn.addEventListener("click", () => {
    // 减
    store.dispatch({ type: "DECREMENT" });
  });

  // 5、通过 store 实例的 getState 方法获取最新状态更新的视图中
</script>
